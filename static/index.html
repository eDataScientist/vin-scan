<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>VIN Scanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>VIN Scanner</h1>
  <p class="sub">Point at the VIN plate or the mulkiya</p>

  <label class="shot" for="file">
    <input type="file" id="file" accept="image/*" capture="environment">
    <span class="cam" aria-hidden="true">📷</span>
    <span id="shotLabel">Take photo</span>
  </label>

  <div class="frame" id="frame" hidden>
    <img id="preview" alt="Photo you selected">
  </div>

  <p id="status" role="status" aria-live="polite" hidden></p>

  <section id="out" hidden>
    <p class="tag" id="tag"></p>
    <p class="vin" id="vin"></p>
    <button id="copy" type="button">Copy VIN</button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
